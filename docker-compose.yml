services:
  ngo-blue:
    image: aniketshishodia28/ngo-dashboard:latest
    container_name: ngo-blue
    restart: unless-stopped

  ngo-green:
    image: aniketshishodia28/ngo-dashboard:latest
    container_name: ngo-green
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ngo-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ngo-blue
    restart: unless-stopped